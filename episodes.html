<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: white;
      margin: 0;
      padding: 10px;
    }
    .header {
      font-size: 20px;
      margin-bottom: 20px;
    }
    .episode-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .episode-item {
      background-color: #333;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    video {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header" id="content-title"></div>
  <video id="player" controls></video>
  <div class="episode-list" id="episode-list">
    <!-- Episode items will be added dynamically -->
  </div>

  <script>
    // Sample content data
    const contentData = {
      series: {
        1: [
          { title: "Episode 1", url: "https://example.com/series1/ep1.mp4" },
          { title: "Episode 2", url: "https://example.com/series1/ep2.mp4" },
        ],
        2: [
          { title: "Episode 1", url: "https://example.com/series2/ep1.mp4" },
          { title: "Episode 2", url: "https://example.com/series2/ep2.mp4" },
        ],
      },
      movies: {
        3: [{ title: "ဇာတ်ကားတစ်ကား", url: "https://example.com/movies/movie1.mp4" }],
        4: [{ title: "ဇာတ်ကားနှစ်ကား", url: "https://example.com/movies/movie2.mp4" }],
      },
    };

    // Sample content titles
    const contentTitles = {
      1: "စီးရီးတစ်ခု",
      2: "စီးရီးနှစ်ခု",
      3: "ဇာတ်ကားတစ်ကား",
      4: "ဇာတ်ကားနှစ်ကား",
    };

    // Get content ID and type from URL
    const urlParams = new URLSearchParams(window.location.search);
    const contentId = urlParams.get("contentId");
    const type = urlParams.get("type");

    // Set content title
    document.getElementById("content-title").textContent = contentTitles[contentId] || "Unknown Content";

    // Get episode list or movie
    const data = type === "series" ? contentData.series[contentId] : contentData.movies[contentId];
    const episodeList = document.getElementById("episode-list");
    const player = document.getElementById("player");

    if (type === "movie") {
      // For movies, directly play the video
      episodeList.style.display = "none"; // Hide episode list
      player.src = data[0].url;
      player.play();
    } else {
      // For series, show episode list
      data.forEach(episode => {
        const episodeItem = document.createElement("div");
        episodeItem.className = "episode-item";
        episodeItem.textContent = episode.title;
        episodeItem.onclick = () => {
          player.src = episode.url;
          player.play();
        };
        episodeList.appendChild(episodeItem);
      });
    }

    // Telegram WebApp initialization
    window.Telegram.WebApp.ready();
  </script>
</body>
</html>
